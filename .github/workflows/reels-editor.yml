name: Edit Reels

on:
  schedule:
    # Automatically runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      video_url:
        description: "Manual Video URL override (leave blank to pull next pending from Sheet)"
        required: false
        type: string
      row_id:
        description: "Sheet Row ID to mark as posted (optional, for manual run)"
        required: false
        type: string
      title:
        description: "Custom Title (optional for manual run; pulled from Sheet Column D if empty)"
        required: false
        type: string

concurrency:
  group: reels-processing
  cancel-in-progress: false

jobs:
  edit-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg jq curl python3-pip
          pip3 install --upgrade --no-cache-dir yt-dlp

      - name: Fetch Next Video URL & Title
        id: fetch_url
        run: |
          MANUAL_URL="${{ github.event.inputs.video_url }}"
          MANUAL_ROW="${{ github.event.inputs.row_id }}"
          MANUAL_TITLE="${{ github.event.inputs.title }}"

          if [ -n "$MANUAL_URL" ]; then
            echo "Manual run detected with URL: $MANUAL_URL"
            echo "TARGET_URL=$MANUAL_URL" >> $GITHUB_ENV

            if [ -n "$MANUAL_TITLE" ]; then
              echo "VIDEO_TITLE=$MANUAL_TITLE" >> $GITHUB_ENV
            else
              echo "VIDEO_TITLE=🎙️ আনিসুর রহমান আশরাফী #shorts" >> $GITHUB_ENV
            fi

            if [ -n "$MANUAL_ROW" ]; then
              echo "Manual Row ID provided: $MANUAL_ROW"
              echo "ROW_NUMBER=$MANUAL_ROW" >> $GITHUB_ENV
            else
              echo "No Row ID provided for manual run. Sheet will not be updated."
              echo "ROW_NUMBER=" >> $GITHUB_ENV
            fi
          else
            echo "Fetching next pending URL from Google Sheet..."
            API_RESPONSE=$(curl -sL "${{ secrets.SHEET_API_URL }}?action=getNext")
            
            echo "Raw Sheet API Response: $API_RESPONSE"

            # Validate whether the response is valid JSON
            if ! echo "$API_RESPONSE" | jq empty > /dev/null 2>&1; then
              echo "ERROR: Received non-JSON response from Google Sheet API (Check Apps Script permissions/deployment):"
              echo "$API_RESPONSE"
              exit 1
            fi

            TARGET_URL=$(echo "$API_RESPONSE" | jq -r '.url')
            ROW_NUMBER=$(echo "$API_RESPONSE" | jq -r '.row')
            FETCHED_TITLE=$(echo "$API_RESPONSE" | jq -r '.title // empty')

            if [ "$TARGET_URL" = "null" ] || [ -z "$TARGET_URL" ]; then
              echo "No pending videos found in Google Sheet. Exiting workflow cleanly."
              echo "SKIP_JOB=true" >> $GITHUB_ENV
              exit 0
            fi

            if [ -z "$FETCHED_TITLE" ] || [ "$FETCHED_TITLE" = "null" ]; then
              FETCHED_TITLE="🎙️ আনিসুর রহমান আশরাফী #shorts"
            fi

            echo "Target URL fetched (Row: $ROW_NUMBER): $TARGET_URL"
            echo "Target Title fetched: $FETCHED_TITLE"
            echo "TARGET_URL=$TARGET_URL" >> $GITHUB_ENV
            echo "VIDEO_TITLE=$FETCHED_TITLE" >> $GITHUB_ENV
            echo "ROW_NUMBER=$ROW_NUMBER" >> $GITHUB_ENV
          fi

      - name: Download Video (Direct First with Proxy Fallback)
        if: env.SKIP_JOB != 'true'
        run: |
          rm -f input.mp4
          echo "Processing URL: $TARGET_URL"
          DOWNLOAD_SUCCESS=false

          # 1. First Attempt: Direct download without proxy
          echo "Attempting direct download first..."
          yt-dlp "$TARGET_URL" \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --no-playlist \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
            --merge-output-format mp4 \
            --force-overwrites \
            --socket-timeout 20 \
            -o input.mp4 || true

          if [ -s input.mp4 ] && [ $(wc -c < input.mp4) -gt 300000 ]; then
            echo "SUCCESS: Direct download succeeded!"
            DOWNLOAD_SUCCESS=true
          fi

          # 2. Fallback: Try randomized proxies if direct download failed
          if [ "$DOWNLOAD_SUCCESS" = false ] && [ -n "${{ secrets.PROXY_LIST }}" ]; then
            echo "Direct download failed. Falling back to proxies list..."
            mapfile -t PROXIES < <(echo "${{ secrets.PROXY_LIST }}" | grep -v '^[[:space:]]*$' | shuf)
            echo "Found ${#PROXIES[@]} proxies in list. Starting randomized attempts..."

            for PROXY in "${PROXIES[@]}"; do
              PROXY=$(echo "$PROXY" | tr -d '\r' | xargs)
              echo "Attempting download using proxy: $(echo "$PROXY" | sed -E 's/:([^@]+)@/:***@/')"

              yt-dlp "$TARGET_URL" \
                --proxy "$PROXY" \
                --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                --no-playlist \
                -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
                --merge-output-format mp4 \
                --force-overwrites \
                --socket-timeout 15 \
                -o input.mp4 || true

              if [ -s input.mp4 ] && [ $(wc -c < input.mp4) -gt 300000 ]; then
                echo "SUCCESS: Video downloaded successfully via proxy!"
                DOWNLOAD_SUCCESS=true
                break
              else
                echo "Proxy attempt failed or timed out. Trying next proxy..."
                rm -f input.mp4
              fi
            done
          fi

          # 3. Validation check
          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo "ERROR: Both direct download and all proxy attempts failed."
            exit 1
          fi

      - name: Verify Download
        if: env.SKIP_JOB != 'true'
        run: |
          if [ ! -s input.mp4 ]; then
            echo "ERROR: Downloaded input.mp4 is empty or missing!"
            exit 1
          fi
          echo "Video successfully prepared. File details:"
          ls -lh input.mp4

      - name: Edit Reel with FFmpeg
        if: env.SKIP_JOB != 'true'
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FILENAME="reel_${TIMESTAMP}.mp4"
          echo "FINAL_FILENAME=$FILENAME" >> $GITHUB_ENV

          # 1. Flip horizontally
          # 2. Scale with force_original_aspect_ratio=increase to fill the entire 1080x1920 frame
          # 3. Center crop to exactly 1080x1920 (eliminates outer borders and square letterboxing)
          # 4. Apply full-overlay.png on top
          ffmpeg -y \
            -i input.mp4 \
            -i full-overlay.png \
            -filter_complex "
              [0:v]
              hflip,
              scale=w=1080:h=1920:force_original_aspect_ratio=increase,
              crop=1080:1920:(in_w-1080)/2:(in_h-1920)/2[video];

              [video][1:v]
              overlay=0:0[out]
            " \
            -map "[out]" \
            -map 0:a? \
            -c:v libx264 \
            -preset ultrafast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            "$FILENAME"

      - name: Upload to media-storage Release
        if: env.SKIP_JOB != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_STORAGE_TOKEN }}
        run: |
          TAG="v1.0"
          TARGET_REPO="shehab24/media-storage"

          gh release upload "$TAG" "$FINAL_FILENAME" --repo "$TARGET_REPO" --clobber || \
          gh release create "$TAG" "$FINAL_FILENAME" --repo "$TARGET_REPO" --title "Media Storage" --notes "Reel assets"

          VIDEO_PUBLIC_URL="https://github.com/${TARGET_REPO}/releases/download/${TAG}/${FINAL_FILENAME}"
          echo "VIDEO_PUBLIC_URL=$VIDEO_PUBLIC_URL" >> $GITHUB_ENV
          echo "Public asset URL: $VIDEO_PUBLIC_URL"

      - name: Publish to Buffer (shareNow)
        if: env.SKIP_JOB != 'true'
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_ID }}
        run: |
          RAW_TITLE="${{ env.VIDEO_TITLE }}"
          
          # YouTube Title (Includes #shorts)
          YT_TITLE="$RAW_TITLE #shorts"
          
          # Universal Post Caption across platforms
          CAPTION=$(printf "%s\n\n#anisur_rahman_ashrafi #islamicshorts #banglawazislamiclecture #reels #shorts" "$RAW_TITLE")

          IFS=',' read -ra PROFILES <<< "$BUFFER_PROFILE_IDS"

          for profile in "${PROFILES[@]}"; do
            profile_id=$(echo "$profile" | xargs)
            if [ -n "$profile_id" ]; then

              # Map platform metadata directly based on Channel ID
              if [ "$profile_id" = "6a74de6799afb4434914e171" ]; then
                echo "----------------------------------------------------"
                echo "Publishing to YouTube (Shorts) ID: $profile_id with Title: $YT_TITLE"
                METADATA_JSON=$(jq -n --arg title "$YT_TITLE" '{youtube: {title: $title, categoryId: "22", notifySubscribers: true}}')

              elif [ "$profile_id" = "6a72d9dd99afb44349056b4a" ]; then
                echo "----------------------------------------------------"
                echo "Publishing to Facebook (Reels) ID: $profile_id..."
                METADATA_JSON=$(jq -n '{facebook: {type: "reel"}}')

              elif [ "$profile_id" = "6a72d98e99afb44349056a2e" ]; then
                echo "----------------------------------------------------"
                echo "Publishing to TikTok ID: $profile_id..."
                METADATA_JSON="null"

              else
                echo "----------------------------------------------------"
                echo "Publishing to generic channel ID: $profile_id..."
                METADATA_JSON="null"
              fi

              PAYLOAD=$(jq -n \
                --arg channelId "$profile_id" \
                --arg text "$CAPTION" \
                --arg videoUrl "$VIDEO_PUBLIC_URL" \
                --argjson metadata "$METADATA_JSON" \
                '{
                  query: "mutation CreatePost($input: CreatePostInput!) { createPost(input: $input) { ... on PostActionSuccess { post { id status } } ... on MutationError { message } } }",
                  variables: {
                    input: ({
                      channelId: $channelId,
                      schedulingType: "automatic",
                      mode: "shareNow",
                      text: $text,
                      assets: [
                        {
                          video: {
                            url: $videoUrl
                          }
                        }
                      ]
                    } + (if $metadata != null then {metadata: $metadata} else {} end))
                  }
                }')

              RESPONSE=$(curl -s -X POST "https://api.buffer.com" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $BUFFER_ACCESS_TOKEN" \
                -d "$PAYLOAD")

              echo "Buffer Response: $RESPONSE"
            fi
          done

      - name: Prune Old Release Assets (Keep Latest 5)
        if: env.SKIP_JOB != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_STORAGE_TOKEN }}
        run: |
          TAG="v1.0"
          TARGET_REPO="shehab24/media-storage"

          echo "Pruning older release assets from $TARGET_REPO..."
          gh release view "$TAG" --repo "$TARGET_REPO" --json assets --jq '.assets[] | select(.name | endswith(".mp4")) | .name' | \
            head -n -5 | while read -r old_file; do
              if [ -n "$old_file" ]; then
                echo "Deleting old asset: $old_file"
                gh release delete-asset "$TAG" "$old_file" --repo "$TARGET_REPO" -y || true
              fi
            done

      - name: Update Google Sheet Status to 'posted'
        if: env.SKIP_JOB != 'true' && env.ROW_NUMBER != ''
        run: |
          echo "Updating Sheet Row ${{ env.ROW_NUMBER }} to 'posted'..."
          UPDATE_RES=$(curl -sL "${{ secrets.SHEET_API_URL }}?action=markPosted&row=${{ env.ROW_NUMBER }}")
          echo "Sheet update response: $UPDATE_RES"

      - name: Done
        if: env.SKIP_JOB != 'true'
        run: echo "Process complete! Video published to Buffer via shareNow and logged in Google Sheet."
